minimumReleaseAge: 10080
onlyBuiltDependencies: []

# The store has to sit on the same filesystem as node_modules for pnpm to
# hardlink packages into place instead of copying them; since node_modules is
# now on the bind-mounted project tree, the store follows it there. The path is
# relative to this file, gitignored, and safe to delete.
storeDir: .pnpm-store
